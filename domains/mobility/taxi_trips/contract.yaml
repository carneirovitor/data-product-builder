dataContractSpecification: "0.9.3"
id: urn:datacontract:mobility:taxi_trips
info:
  title: Mobility Taxi Trips
  version: "1.3.0"
  description: >
    Governed yellow+green TLC trip records (Jan–May 2023), specialized for
    Data Quality & Governance. Consumption exposes the five required CDEs plus
    taxi_type and year_month. Row-level DQ is executed by Soda Core (see
    data_quality/checks.yml); this contract remains the policy source of truth
    (schema, DAMA dimensions, severity, fitness).
  owner: governance_team
  contact:
    name: Data Quality & Governance
    email: dq-governance@example.com
  authoritativeDefinitions:
    - type: pdf
      url: files/data_dictionary_trip_records_yellow.pdf
      description: NYC TLC Yellow Trip Records Data Dictionary (March 2025)
    - type: pdf
      url: files/data_dictionary_trip_records_green.pdf
      description: NYC TLC Green (LPEP/SHL) Trip Records Data Dictionary (March 2025)
    - type: url
      url: http://www.nyc.gov/html/tlc/html/about/trip_record_data.shtml
      description: TLC trip record data portal and zone metadata

terms:
  usage: >
    Analytical consumption for fleet pricing and occupancy questions (Q1/Q2).
    Soft validity on passenger_count and total_amount sign do not quarantine rows
    so Q1/Q2 remain representative of the hard-approved fleet.
  limitations: >
    Scope is yellow and green taxis only (FHV/FHVHV excluded). Historical batch
    overwrite for 2023-01..05 — not streaming freshness. Green pickup/dropoff
    source columns lpep_pickup_datetime / lpep_dropoff_datetime — and the yellow
    tpep_* equivalents — are harmonized to canonical pickup_datetime /
    dropoff_datetime, because neither vendor prefix is true for the whole fleet.
    consumption.vw_taxi_trips_tlc republishes the original TLC column names for
    consumers pinned to them.
  policies:
    - name: hard_rules_quarantine
      description: severity error row rules move rows to clean.taxi_trips_quarantine
    - name: soft_rules_scorecard_only
      description: severity warning does not remove rows from clean

servers:
  local:
    type: local
    path: files/
    description: Local landing (parquet under files/)
  databricks:
    type: databricks
    catalog: "${CATALOG}"
    schemas:
      raw: raw
      clean: clean
      consumption: consumption
      governance: governance

servicelevels:
  availability:
    description: Batch product covering declared months 2023-01 through 2023-05
  retention:
    description: Quarantine retained as incident trail for the same overwrite window
  latency:
    description: >
      Timeliness is coverage of the declared period plus ingest_ts/run_id,
      not a streaming freshness SLA

models:
  taxi_trips:
    description: >
      Canonical trip grain after raw ingest, hard-rule clean gate, and consumption
      publish. Unions yellow (TPEP) and green (LPEP/SHL) TLC records with a shared
      schema in platform snake_case: the source tpep_* / lpep_* prefixes name the
      vendor programme, not the fleet, so both collapse to pickup_datetime /
      dropoff_datetime. Five CDEs (vendor_id, passenger_count, total_amount,
      pickup/dropoff datetimes) plus taxi_type and year_month partition key.
    type: table
    classification: public
    contains_pii: false
    fields:
      vendor_id:
        type: long
        required: true
        classification: public
        pii: false
        business_term: meter_vendor_id
        description: >
          TLC technology-provider code for the meter record. Yellow (TPEP): 1 = Creative
          Mobile Technologies, LLC; 2 = Curb Mobility, LLC; 6 = Myle Technologies Inc;
          7 = Helix. Green (LPEP): 1 = Creative Mobile Technologies, LLC;
          2 = Curb Mobility, LLC; 6 = Myle Technologies Inc.
      passenger_count:
        type: double
        required: false
        classification: public
        pii: false
        business_term: trip_occupancy
        description: >
          Number of passengers in the vehicle — a driver-entered value per TLC.
          Frequently null or 0 on cash trips; retained in clean for Q2 fleet occupancy.
      total_amount:
        type: double
        required: true
        classification: public
        pii: false
        business_term: trip_total_fare
        description: >
          Total amount charged to passengers per TLC; does not include cash tips
          (credit-card tips may appear in tip_amount on raw feeds). Negative values
          may represent adjustments, refunds, or disputes — not always data errors.
      pickup_datetime:
        type: timestamp
        required: true
        classification: public
        pii: false
        business_term: trip_pickup_timestamp
        description: >
          Pickup timestamp — date and time when the taximeter was engaged. Canonical
          name: the source columns tpep_pickup_datetime (yellow) and
          lpep_pickup_datetime (green) are both renamed in the clean model.
      dropoff_datetime:
        type: timestamp
        required: true
        classification: public
        pii: false
        business_term: trip_dropoff_timestamp
        description: >
          Dropoff timestamp — date and time when the taximeter was disengaged. Canonical
          name: the source columns tpep_dropoff_datetime (yellow) and
          lpep_dropoff_datetime (green) are both renamed in the clean model.
      taxi_type:
        type: string
        required: true
        enum: [yellow, green]
        classification: public
        pii: false
        business_term: taxi_fleet_type
        description: >
          Fleet discriminator — yellow (medallion TPEP) or green (Boro/SHL LPEP).
          FHV/FHVHV trip types are out of scope for this product.
      year_month:
        type: string
        required: true
        classification: public
        pii: false
        business_term: pickup_year_month
        description: >
          Partition key YYYY-MM derived from pickup_datetime (pickup month).

  vw_taxi_trips_tlc:
    description: >
      Compatibility interface over consumption.taxi_trips under the original TLC
      column names. Same rows and same grain — only the naming differs, for
      consumers pinned to VendorID / tpep_* instead of platform snake_case.
    type: view
    classification: public
    contains_pii: false
    fields:
      VendorID:
        type: long
        required: true
        classification: public
        pii: false
        business_term: meter_vendor_id
        description: >
          TLC-named alias of vendor_id. See consumption.taxi_trips.vendor_id for
          the provider code meanings.
      passenger_count:
        type: double
        required: false
        classification: public
        pii: false
        business_term: trip_occupancy
        description: Number of passengers in the vehicle — driver-entered value per TLC.
      total_amount:
        type: double
        required: true
        classification: public
        pii: false
        business_term: trip_total_fare
        description: Total amount charged to passengers per TLC; excludes cash tips.
      tpep_pickup_datetime:
        type: timestamp
        required: true
        classification: public
        pii: false
        business_term: trip_pickup_timestamp
        description: >
          TLC-named alias of pickup_datetime. The tpep_ prefix is the yellow vendor
          programme and is retained here only for interface compatibility — green
          rows are present under this name too.
      tpep_dropoff_datetime:
        type: timestamp
        required: true
        classification: public
        pii: false
        business_term: trip_dropoff_timestamp
        description: >
          TLC-named alias of dropoff_datetime. Same prefix caveat as
          tpep_pickup_datetime.
      taxi_type:
        type: string
        required: true
        enum: [yellow, green]
        classification: public
        pii: false
        business_term: taxi_fleet_type
        description: Fleet discriminator — yellow (medallion TPEP) or green (Boro/SHL LPEP).
      year_month:
        type: string
        required: true
        classification: public
        pii: false
        business_term: pickup_year_month
        description: Partition key YYYY-MM derived from the pickup month.

  kpi_yellow_avg_total_amount_monthly:
    description: >
      Q1 — average total_amount per calendar month across the whole yellow
      fleet. Computed from consumption.taxi_trips, so every row already cleared
      the hard quality gate. Negative amounts (TLC refunds and adjustments) are
      deliberately retained: the soft rule keeps them so the average is not biased.
    type: table
    classification: public
    contains_pii: false
    fields:
      year_month:
        type: string
        required: true
        classification: public
        pii: false
        business_term: pickup_year_month
        description: Calendar month of pickup, YYYY-MM. One row per month in scope.
      avg_total_amount:
        type: double
        required: true
        classification: public
        pii: false
        business_term: monthly_avg_trip_fare
        description: >
          The Q1 answer — mean total_amount over all yellow trips in the month.
          Unweighted per-trip mean, not revenue divided by any other denominator.
      trip_count:
        type: long
        required: true
        classification: public
        pii: false
        business_term: metric_sample_size
        description: >
          Yellow trips behind the average — the denominator, published so consumers
          can judge how much weight each month carries.
      run_id:
        type: string
        required: true
        classification: public
        pii: false
        business_term: pipeline_run_id
        description: >
          Run that produced this row. Joins to governance.dq_validation_result and
          governance.data_profile, so a metric can be traced to the quality
          evidence of the exact run that computed it.
      computed_at:
        type: timestamp
        required: true
        classification: public
        pii: false
        business_term: metric_computed_at
        description: Wall-clock timestamp when the metric was materialized.

  kpi_fleet_avg_passenger_count_hourly:
    description: >
      Q2 — average passenger_count by hour of day for May 2023 across the
      whole fleet (yellow and green). Computed from consumption.taxi_trips.
      passenger_count is a soft rule, so out-of-range and null values are not
      quarantined; null_passenger_count exposes how much of the hour is missing.
    type: table
    classification: public
    contains_pii: false
    fields:
      pickup_hour:
        type: integer
        required: true
        classification: public
        pii: false
        business_term: pickup_hour_of_day
        description: Hour of day of pickup, 0–23. One row per hour.
      avg_passenger_count:
        type: double
        required: true
        classification: public
        pii: false
        business_term: hourly_avg_occupancy
        description: >
          The Q2 answer — mean passenger_count over all fleet trips picked up in
          that hour during May 2023. Nulls are excluded by AVG, so read this
          together with null_passenger_count.
      trip_count:
        type: long
        required: true
        classification: public
        pii: false
        business_term: metric_sample_size
        description: Fleet trips picked up in that hour — the denominator.
      null_passenger_count:
        type: long
        required: true
        classification: public
        pii: false
        business_term: metric_null_exposure
        description: >
          Trips in the hour with a null passenger_count. Published because those
          rows are inside trip_count but outside the average — the reader needs
          both to judge whether the occupancy figure is trustworthy.
      run_id:
        type: string
        required: true
        classification: public
        pii: false
        business_term: pipeline_run_id
        description: >
          Run that produced this row. Joins to the governance tables for the
          quality evidence of the exact run that computed it.
      computed_at:
        type: timestamp
        required: true
        classification: public
        pii: false
        business_term: metric_computed_at
        description: Wall-clock timestamp when the metric was materialized.

# Custom extensions interpreted by dq_engine / governance_engine (not ODCS v3)
profiling:
  layers: [raw, clean, consumption]
  columns:
    - vendor_id
    - passenger_count
    - total_amount
    - pickup_datetime
    - dropoff_datetime
    - taxi_type
    - year_month
  metrics: [row_count, null_rate, min, max, avg]

quality:
  - name: total_amount_non_negative
    dimension: accuracy
    scope: row
    severity: warning
    description: >
      Negative total_amount may be TLC adjustments/refunds/disputes — flagged on the
      scorecard for transparency, not removed from consumption fleet metrics (Q1/Q2).
    expression: "total_amount IS NOT NULL AND total_amount >= 0"

  - name: dropoff_after_pickup
    dimension: consistency
    scope: row
    severity: error
    description: dropoff datetime must be >= pickup datetime
    expression: "dropoff_datetime >= pickup_datetime"

  - name: vendor_id_not_null
    dimension: completeness
    scope: row
    severity: error
    expression: "vendor_id IS NOT NULL"

  - name: total_amount_not_null
    dimension: completeness
    scope: row
    severity: error
    description: Completeness check — total_amount required; distinct from sign validity
    expression: "total_amount IS NOT NULL"

  - name: pickup_not_null
    dimension: completeness
    scope: row
    severity: error
    expression: "pickup_datetime IS NOT NULL"

  - name: dropoff_not_null
    dimension: completeness
    scope: row
    severity: error
    expression: "dropoff_datetime IS NOT NULL"

  - name: taxi_type_valid
    dimension: validity
    scope: row
    severity: error
    expression: "taxi_type IN ('yellow', 'green')"

  - name: year_month_in_window
    dimension: completeness
    scope: row
    severity: error
    description: Only Jan–May 2023 in scope
    expression: "year_month IN ('2023-01','2023-02','2023-03','2023-04','2023-05')"

  - name: passenger_count_range
    dimension: validity
    scope: row
    severity: warning
    description: Soft — do NOT quarantine (protects Q2 fleet representativeness)
    expression: "passenger_count IS NOT NULL AND passenger_count BETWEEN 1 AND 6"

  - name: vendor_id_enum
    dimension: validity
    scope: row
    severity: warning
    description: Soft enum — flags legacy vendors 1 and 2; yellow also uses 6, 7
    expression: "vendor_id IN (1, 2)"

  - name: month_coverage
    dimension: completeness
    scope: aggregate
    severity: error
    description: >
      Completeness of the analytical window — all five declared months must be
      present in clean (not timeliness/freshness: this product is a historical
      batch overwrite, not a streaming SLA).
    metric: distinct_year_month
    threshold: 5
    comparator: gte

  - name: quarantine_rate_cap
    dimension: accuracy
    scope: aggregate
    severity: warning
    description: Quarantine rate should stay below 5%
    metric: quarantine_rate
    threshold: 0.05
    comparator: lte

  - name: uniqueness_rate
    dimension: uniqueness
    scope: aggregate
    severity: warning
    description: Approximate duplicate rate on business key
    metric: duplicate_rate
    threshold: 0.01
    comparator: lte

  - name: volume_sanity
    dimension: completeness
    scope: aggregate
    severity: warning
    description: >
      Aggregate completeness signal — a month below 50% of the median volume
      often means a partial/missing load for that partition (not a freshness SLA).
    metric: volume_anomaly_ratio
    threshold: 0.5
    comparator: gte

fitness_for_use:
  - name: q1_months_present
    use_case: Q1_yellow_avg_total_amount_by_month
    severity: error
    description: Q1 needs five months of yellow aggregates
    metric: q1_month_count
    threshold: 5
    comparator: eq

  - name: q2_hours_coverage
    use_case: Q2_may_avg_passenger_count_by_hour
    severity: error
    description: May must have activity in at least 20 distinct hours (not forced 24)
    metric: q2_hour_count
    threshold: 20
    comparator: gte

  - name: consumption_schema_cdes
    use_case: consumption_contract
    severity: error
    description: Consumption must expose the five CDEs plus taxi_type
    metric: cde_columns_present
    threshold: 1
    comparator: eq
